apiVersion: batch/v1
kind: Job
metadata:
  name: calibrate-llama70b-v026-replicates-v4
  namespace: vramani-perfcal
  annotations:
    calibration.llm-d.ai/issued-requests: "4155"
    calibration.llm-d.ai/expected-decode-cells: "105"
    calibration.llm-d.ai/min-steady-decode-rows-per-cell: "32"
    calibration.llm-d.ai/expected-prefill-rows: "330"
    calibration.llm-d.ai/expected-mixed-rows: "360"
    calibration.llm-d.ai/max-decode-kv-tokens: "409536"
    calibration.llm-d.ai/measured-kv-capacity-tokens: "506368"
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 1
  backoffLimit: 2
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: calibrate-llama70b-v026-replicates-v4
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vllm-cal-llama70b-v026
              topologyKey: kubernetes.io/hostname
      containers:
        - name: client
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              export SEED="${JOB_COMPLETION_INDEX}";
              export RESULT_DIR="/results/llama3.3-70b-tp4-vllm-0.26.0/replicates-v4/replicate-${JOB_COMPLETION_INDEX}";
              pip install --no-cache-dir httpx numpy;
              python /code/client.py
          env:
            - name: HOME
              value: /tmp
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: VLLM_BASE
              value: http://vllm-cal-llama70b-v026:8000
            - name: MODEL
              value: meta-llama/Llama-3.3-70B-Instruct
            - name: CHUNK_BUD
              value: "8192"
            - name: DECODE_BATCHES
              value: 1,2,4,8,16,32,64
            - name: DECODE_CONTEXTS
              value: 64,256,1024,4096,6144
            - name: DECODE_MAX_TOKENS
              value: "256"
            - name: PREFILL_LENGTHS
              value: 64,128,256,512,1024,2048,4096,8192,12000,16000,24000
            - name: PREFILL_REPEATS
              value: "10"
            - name: MIXED_BATCHES
              value: 4,8,16,32
            - name: MIXED_CONTEXT
              value: "4096"
            - name: MIXED_INJECT
              value: "24000"
            - name: MIXED_MAX_TOKENS
              value: "256"
            - name: MIXED_REPEATS
              value: "10"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: code
              mountPath: /code
            - name: results
              mountPath: /results
      volumes:
        - name: code
          configMap:
            name: calibrate-llama70b-v026-code
        - name: results
          persistentVolumeClaim:
            claimName: cal-results-pvc
