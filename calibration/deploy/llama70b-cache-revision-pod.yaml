apiVersion: v1
kind: Pod
metadata:
  name: llama70b-cache-revision
  namespace: vramani-perfcal
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pokprod-b93r43s3
  containers:
    - name: inspect
      image: alpine:3.19
      command: ["/bin/sh", "-c"]
      args:
        - >-
          set -eu;
          ref="$(find /models-cache -type f
          -path '*/models--meta-llama--Llama-3.3-70B-Instruct/refs/main'
          | head -n 1)";
          test -n "$ref";
          printf 'revision=';
          cat "$ref"
      volumeMounts:
        - name: models-cache
          mountPath: /models-cache
          readOnly: true
  volumes:
    - name: models-cache
      persistentVolumeClaim:
        claimName: model-cache-70b
