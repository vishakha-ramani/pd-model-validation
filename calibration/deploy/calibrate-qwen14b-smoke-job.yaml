apiVersion: batch/v1
kind: Job
metadata:
  name: calibrate-qwen14b-smoke
  namespace: vramani-perfcal
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vllm-cal-qwen14b
              topologyKey: kubernetes.io/hostname
      containers:
        - name: client
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir httpx && python /code/client.py
          env:
            - name: HOME
              value: /tmp
            - name: VLLM_BASE
              value: http://vllm-cal-qwen14b:8000
            - name: MODEL
              value: Qwen/Qwen3-14B
            - name: CHUNK_BUD
              value: "2048"
            - name: RESULT_DIR
              value: /results/qwen3-14b-tp1-vllm-0.23.0/smoke
            - name: SEED
              value: "0"
            - name: DECODE_BATCHES
              value: 1,4
            - name: DECODE_CONTEXTS
              value: 64,1024
            - name: DECODE_MAX_TOKENS
              value: "32"
            - name: PREFILL_LENGTHS
              value: 64,2048,4096
            - name: PREFILL_REPEATS
              value: "1"
            - name: MIXED_BATCHES
              value: "4"
            - name: MIXED_CONTEXT
              value: "1024"
            - name: MIXED_INJECT
              value: "4096"
            - name: MIXED_MAX_TOKENS
              value: "128"
            - name: MIXED_REPEATS
              value: "1"
          volumeMounts:
            - name: code
              mountPath: /code
            - name: results
              mountPath: /results
      volumes:
        - name: code
          configMap:
            name: calibrate-qwen14b-code
        - name: results
          persistentVolumeClaim:
            claimName: cal-results-pvc
