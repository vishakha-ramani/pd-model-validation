apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cal
  namespace: vramani-perfcal
  labels:
    app: vllm-cal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-cal
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: server
          image: 'vllm/vllm-openai:v0.11.0'
          command: ["/bin/sh", "-c"]
          args:
            - "vllm serve meta-llama/Llama-3.3-70B-Instruct --tensor-parallel-size 4 --no-enable-prefix-caching --seed 0 --download-dir /models-cache"
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HOME
              value: /models-cache
            - name: VLLM_PORT
              value: "8000"
          resources:
            limits:
              cpu: '16'
              memory: 96Gi
              nvidia.com/gpu: '4'
            requests:
              cpu: '12'
              memory: 64Gi
              nvidia.com/gpu: '4'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          volumeMounts:
            - name: models-cache
              mountPath: /models-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models-cache
          persistentVolumeClaim:
            claimName: model-cache-70b
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-cal
  namespace: vramani-perfcal
spec:
  selector:
    app: vllm-cal
  ports:
    - name: http
      port: 8000
      targetPort: 8000
