apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cal-qwen14b-v026
  namespace: vramani-perfcal
  labels:
    app: vllm-cal-qwen14b-v026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cal-qwen14b-v026
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-cal-qwen14b-v026
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: server
          image: docker.io/vllm/vllm-openai@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b
          command: ["/bin/sh", "-c"]
          args:
            - >-
              vllm serve Qwen/Qwen3-14B
              --revision 40c069824f4251a91eefaf281ebe4c544efd3e18
              --tensor-parallel-size 1
              --block-size 16
              --max-model-len 32768
              --max-num-seqs 256
              --max-num-batched-tokens 2048
              --enable-chunked-prefill
              --no-enable-prefix-caching
              --seed 0
              --download-dir /models-cache
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HOME
              value: /models-cache
            # OpenShift assigns an arbitrary UID that is not present in
            # /etc/passwd. PyTorch 2.9 calls getpass.getuser while importing;
            # USER keeps that lookup independent of the image's passwd file.
            - name: USER
              value: vllm
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/torchinductor
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: VLLM_PORT
              value: "8000"
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "12"
              memory: 48Gi
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models-cache
              mountPath: /models-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models-cache
          persistentVolumeClaim:
            claimName: model-cache-70b
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-cal-qwen14b-v026
  namespace: vramani-perfcal
spec:
  selector:
    app: vllm-cal-qwen14b-v026
  ports:
    - name: http
      port: 8000
      targetPort: 8000
