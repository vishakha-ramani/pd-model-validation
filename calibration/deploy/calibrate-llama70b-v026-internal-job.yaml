apiVersion: batch/v1
kind: Job
metadata:
  name: calibrate-llama70b-v026-internal-v1
  namespace: vramani-perfcal
  annotations:
    calibration.llm-d.ai/issued-requests: "4155"
    calibration.llm-d.ai/replicates: "3"
    calibration.llm-d.ai/measurement: exact-vllm-scheduler-state
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: calibrate-llama70b-v026-internal-v1
        calibration.llm-d.ai/owner: vramani
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vllm-cal-llama70b-v026-internal
              topologyKey: kubernetes.io/hostname
      containers:
        - name: client
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              export SEED="${JOB_COMPLETION_INDEX}";
              export REQUEST_PREFIX="internal-v1:s${JOB_COMPLETION_INDEX}";
              export RESULT_DIR="/results/llama3.3-70b-tp4-vllm-0.26.0/internal-v1/client/replicate-${JOB_COMPLETION_INDEX}";
              python /code/preflight.py;
              pip install --no-cache-dir httpx;
              python /code/client.py;
              python /code/preflight.py
          env:
            - name: HOME
              value: /tmp
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: VLLM_BASE
              value: http://vllm-cal-llama70b-v026-internal:8000
            - name: MODEL
              value: meta-llama/Llama-3.3-70B-Instruct
            - name: CHUNK_BUD
              value: "8192"
            - name: DECODE_BATCHES
              value: 1,2,4,8,16,32,64
            - name: DECODE_CONTEXTS
              value: 64,256,1024,4096,6144
            - name: DECODE_MAX_TOKENS
              value: "256"
            - name: PREFILL_LENGTHS
              value: 64,128,256,512,1024,2048,4096,8192,12000,16000,24000
            - name: PREFILL_REPEATS
              value: "10"
            - name: MIXED_BATCHES
              value: 4,8,16,32
            - name: MIXED_CONTEXT
              value: "4096"
            - name: MIXED_INJECT
              value: "24000"
            - name: MIXED_MAX_TOKENS
              value: "256"
            - name: MIXED_REPEATS
              value: "10"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: code
              mountPath: /code
            - name: results
              mountPath: /results
      volumes:
        - name: code
          configMap:
            name: calibrate-llama70b-v026-internal-code
        - name: results
          persistentVolumeClaim:
            claimName: cal-results-pvc
