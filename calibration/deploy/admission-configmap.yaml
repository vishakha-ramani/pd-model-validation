apiVersion: v1
kind: ConfigMap
metadata:
  name: admission-hook
  namespace: vramani-perfcal
data:
  sitecustomize.py: |
    """Admission-validation vLLM 0.11.0 instrumentation hook.

    Sibling of the frozen calibration/modeb/sitecustomize.py hook. Reuses that
    module's JsonlWriter/_log/_PATCHED structure and its extract_reqs() call on
    the scheduler output, and additionally captures:
      - per-request enqueue events (admission_events.jsonl), via a
        Scheduler.add_request patch stamped with time.perf_counter();
      - the waiting-queue snapshot and free-KV-block count at schedule time, via
        a Scheduler.schedule patch;
      - an extended per-step trajectory record (trajectory.jsonl) that adds the
        waiting-queue/free-KV fields to the Mode-B running-batch fields.

    Auto-imported by CPython at interpreter startup for every process on
    PYTHONPATH, including the spawned EngineCoreProc child that runs the
    scheduler loop. Ships in a ConfigMap alongside admission_capture.py and the
    frozen modeb_capture.py; stdlib + those two capture modules only.
    """
    import json
    import os
    import sys
    import time

    try:
        # In the container both this file and its sibling capture module sit at
        # PYTHONPATH=/opt/admission as top-level modules, alongside the frozen
        # Mode-B capture module at /opt/modeb.
        from admission_capture import build_enqueue_record, cap_waiting, build_admission_step_record
    except ImportError:
        # In the offline test env this file is imported as calibration.admission.sitecustomize.
        from calibration.admission.admission_capture import (
            build_enqueue_record, cap_waiting, build_admission_step_record,
        )

    try:
        from modeb_capture import extract_reqs
    except ImportError:
        from calibration.modeb.modeb_capture import extract_reqs

    _PATCHED = False


    def _int_env(name, default):
        try:
            return int(os.environ.get(name, default))
        except (TypeError, ValueError):
            return default


    MAX_WAITING_IDS = _int_env("ADMISSION_MAX_WAITING_IDS", 512)
    OUT_DIR = os.environ.get("ADMISSION_OUT_DIR", "/results/admission")


    def _log(msg):
        # sentinel to prove the hook loaded inside the (spawned) child process
        print(f"[ADMISSION] {msg}", file=sys.stderr, flush=True)


    class JsonlWriter:
        def __init__(self, path, flush_every=50):
            self.path = path
            self.flush_every = flush_every
            self._buf = []
            os.makedirs(os.path.dirname(path), exist_ok=True)

        def write(self, record):
            self._buf.append(json.dumps(record))
            if len(self._buf) >= self.flush_every:
                self.flush()

        def flush(self):
            if not self._buf:
                return
            with open(self.path, "a") as f:
                f.write("\n".join(self._buf) + "\n")
            self._buf = []


    def capture_meta(vllm_config):
        sc = vllm_config.scheduler_config
        return {
            "max_num_batched_tokens": sc.max_num_batched_tokens,
            "chunked_prefill_enabled": sc.chunked_prefill_enabled,
            "async_scheduling": getattr(sc, "async_scheduling", False),
            "max_num_partial_prefills": getattr(sc, "max_num_partial_prefills", 1),
            "long_prefill_token_threshold": getattr(sc, "long_prefill_token_threshold", 0),
            "max_model_len": getattr(sc, "max_model_len", None),
            "num_gpu_blocks": getattr(vllm_config.cache_config, "num_gpu_blocks", None),
            "model": vllm_config.model_config.model,
            "tensor_parallel_size": vllm_config.parallel_config.tensor_parallel_size,
            "block_size": vllm_config.cache_config.block_size,
            "max_num_seqs": sc.max_num_seqs,
            "waiting_ids_cap": MAX_WAITING_IDS,
            "enq_clock": "perf_counter",
        }


    def install():
        """Idempotently patch vllm. Returns True if patched, False if vllm absent/already patched."""
        global _PATCHED
        if _PATCHED:
            return False
        try:
            from vllm.v1.engine.core import EngineCore
            from vllm.v1.core.sched.scheduler import Scheduler
        except Exception:
            return False  # vllm not present (e.g. offline test env) -> no-op

        state = {"writer": None, "enq_writer": None, "prompt_len_cache": {}, "step": 0,
                 "last_output": None, "last_waiting": [], "last_free_kv": None,
                 "meta_written": False}

        _orig_add_request = Scheduler.add_request
        _orig_schedule = Scheduler.schedule
        _orig_step = EngineCore.step

        def add_request(self, request, *a, **kw):
            # Call the original first so a raising original is never masked by
            # our instrumentation, and always return its result even if the
            # logging block below raises.
            result = _orig_add_request(self, request, *a, **kw)
            try:
                t_enq = time.perf_counter()
                rid = getattr(request, "request_id", None) or getattr(request, "req_id", None)
                ptoks = getattr(request, "prompt_token_ids", None)
                try:
                    plen = len(ptoks) if ptoks is not None else getattr(request, "num_prompt_tokens", 0)
                except Exception:
                    plen = 0
                if state["enq_writer"] is None:
                    os.makedirs(OUT_DIR, exist_ok=True)
                    state["enq_writer"] = JsonlWriter(os.path.join(OUT_DIR, "admission_events.jsonl"))
                state["enq_writer"].write(build_enqueue_record(rid, t_enq, plen))
            except Exception:
                pass
            return result

        def schedule(self):
            out = _orig_schedule(self)
            try:
                waiting_ids = [getattr(r, "request_id", getattr(r, "req_id", None)) for r in self.waiting]
            except Exception:
                waiting_ids = []
            try:
                free_kv = self.kv_cache_manager.block_pool.get_num_free_blocks()
            except Exception:
                free_kv = None
            state["last_output"] = out
            state["last_waiting"] = waiting_ids
            state["last_free_kv"] = free_kv
            return out

        def step(self):
            # schedule() runs INSIDE _orig_step, so we must call it first and then read the
            # composition it produced. Reading last_output before _orig_step would pair this
            # step's t_start with the PREVIOUS step's composition (off-by-one). Mirrors Mode B.
            state["last_output"] = None
            t_start = time.perf_counter()
            result = _orig_step(self)
            t_end = time.perf_counter()
            out = state["last_output"]
            if out is not None:
                if state["writer"] is None:
                    os.makedirs(OUT_DIR, exist_ok=True)
                    cfg = getattr(self, "vllm_config", None)
                    if cfg is not None and not state["meta_written"]:
                        with open(os.path.join(OUT_DIR, "meta.json"), "w") as mf:
                            json.dump(capture_meta(cfg), mf, indent=2)
                        state["meta_written"] = True
                    state["writer"] = JsonlWriter(os.path.join(OUT_DIR, "trajectory.jsonl"))
                    _log(f"hook active in pid {os.getpid()}, writing {OUT_DIR}")
                new = [(r.req_id, len(r.prompt_token_ids), r.num_computed_tokens)
                       for r in out.scheduled_new_reqs]
                cached = out.scheduled_cached_reqs
                reqs = extract_reqs(out.num_scheduled_tokens, new,
                                    list(cached.req_ids), list(cached.num_computed_tokens),
                                    state["prompt_len_cache"])
                count, ids, trunc = cap_waiting(state["last_waiting"], MAX_WAITING_IDS)
                rec = build_admission_step_record(
                    state["step"], t_start, t_end, out.total_num_scheduled_tokens,
                    sum(1 for r in reqs if r["computed"] >= r["prompt_len"]),
                    reqs, count, ids, trunc, state["last_free_kv"])
                state["writer"].write(rec)
                state["step"] += 1
            return result

        Scheduler.add_request = add_request
        Scheduler.schedule = schedule
        EngineCore.step = step
        _PATCHED = True
        _log("patched Scheduler.add_request + Scheduler.schedule + EngineCore.step")
        return True


    install()
  admission_capture.py: |
    """Pure per-step and per-request extraction for the admission-validation hook.

    Self-contained (stdlib only, no vllm) so it is unit-testable offline and safe
    to ship in a ConfigMap. Reuses the frozen Mode-B extract_reqs for the running
    batch; adds enqueue-event records and the waiting-queue / free-KV per-step fields.
    """


    def build_enqueue_record(req_id, t_enq, prompt_len):
        """One row per request at its enqueue instant. prompt_len drives ReqKVNeed offline."""
        return {"req_id": req_id, "t_enq": t_enq, "prompt_len": int(prompt_len)}


    def cap_waiting(waiting_ids, max_ids):
        """Return (exact count, leading ids capped at max_ids, truncated flag).

        The count is always exact so queue depth stays correct; only the id list caps.
        """
        ids = list(waiting_ids)
        count = len(ids)
        return count, ids[:max_ids], count > max_ids


    def build_admission_step_record(step, t_start, t_end, total_scheduled, num_running,
                                    reqs, waiting_count, waiting_ids, waiting_truncated,
                                    free_kv_blocks):
        """Assemble one JSONL row: Mode-B running-batch fields plus the queue-and-KV snapshot."""
        return {
            "step": step,
            "t_start": t_start,
            "t_end": t_end,
            "total_scheduled": total_scheduled,
            "num_running": num_running,
            "reqs": reqs,
            "waiting_count": waiting_count,
            "waiting_ids": waiting_ids,
            "waiting_truncated": waiting_truncated,
            "free_kv_blocks": free_kv_blocks,
        }
  modeb_capture.py: |
    """Pure per-step extraction for Mode-B vLLM instrumentation.

    Self-contained (stdlib only, no vllm, no repo imports) so it is unit-testable
    offline and safe to ship in a ConfigMap into the vLLM container.
    """


    def extract_reqs(num_scheduled_tokens, new, cached_ids, cached_computed, prompt_len_cache):
        """Return one raw record per scheduled request this step.

        num_scheduled_tokens: dict[req_id -> kappa] (SchedulerOutput.num_scheduled_tokens)
        new:            list of (req_id, prompt_len, num_computed) for first-time reqs
        cached_ids:     list of req_ids for continuing reqs (struct-of-arrays)
        cached_computed:list of num_computed_tokens, parallel to cached_ids
        prompt_len_cache: dict mutated in place; prompt length is immutable so we cache
                          it from a req's first (new) appearance and reuse it thereafter.
        """
        for rid, plen, _ in new:
            prompt_len_cache[rid] = plen

        computed_by_id = {}
        for rid, _plen, ncomp in new:
            computed_by_id[rid] = ncomp
        for rid, ncomp in zip(cached_ids, cached_computed):
            computed_by_id[rid] = ncomp

        reqs = []
        for rid, kappa in num_scheduled_tokens.items():
            reqs.append({
                "id": rid,
                "kappa": int(kappa),
                "computed": int(computed_by_id[rid]),
                "prompt_len": int(prompt_len_cache[rid]),
            })
        return reqs


    def build_step_record(step, t_start, t_end, total_scheduled, num_running, reqs):
        """Assemble one JSONL row. Stores only raw fields; phase/regime are derived offline.

        t_start / t_end bracket the full step (schedule+execute+update); t_end - t_start is
        a secondary in-step-duration diagnostic. The authoritative T_iter is the inter-step
        delta of t_start, computed offline in parse_trajectory.
        """
        return {
            "step": step,
            "t_start": t_start,
            "t_end": t_end,
            "total_scheduled": total_scheduled,
            "num_running": num_running,
            "reqs": reqs,
        }
